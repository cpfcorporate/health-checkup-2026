<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>健康診断の申し込み</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#2C6BB3; --pri-d:#1E4E86; --pri-l:#E7F0FA;
  --acc:#E8913A; --acc-l:#FDF0E1; --acc-d:#A65511;
  --ok:#2F8A57; --ok-l:#E3F3EA; --ng:#B4442B; --ng-l:#FBE7E1;
  --bg:#F6F5F0; --card:#FFFFFF; --line:#E3E0D6; --text:#1F2A37; --sub:#5B6573; --mute:#8A929C;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.7;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.wide{max-width:1280px}
/* header */
.top{background:linear-gradient(135deg,#2C6BB3,#3D82C9);color:#fff;padding:20px 0 56px}
.top .org{font-size:12px;opacity:.85}
.top h1{font-family:'Zen Maru Gothic',sans-serif;font-size:24px;margin:2px 0 6px;line-height:1.4}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.18)}
/* stepper */
.steps{display:flex;gap:6px;margin-top:-36px;margin-bottom:12px}
.steps .s{flex:1;background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mute);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.steps .s b{display:block;font-size:15px}
.steps .s.on{color:var(--pri);box-shadow:inset 0 -3px 0 var(--pri),0 1px 3px rgba(0,0,0,.06)}
.steps .s.done{color:var(--ok)}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:20px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{font-size:18px;margin:0 0 4px}
.lead{color:var(--sub);font-size:14px;margin:0 0 12px}
label.f{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
label.f .req{color:var(--ng);font-size:12px;margin-left:4px}
.help{font-size:12px;color:var(--mute);margin-top:4px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:48px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.err{color:var(--ng);font-size:13px;font-weight:700;margin-top:6px}
.radio-cards{display:grid;gap:8px}
.rc{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;transition:.15s}
.rc input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--pri);flex:none}
.rc.sel{border-color:var(--pri);background:var(--pri-l)}
.rc .t{font-weight:700}
.rc .d{font-size:13px;color:var(--sub)}
/* age hero */
.age{display:flex;align-items:center;gap:16px;background:var(--pri-l);border-radius:var(--r);padding:16px 20px;margin-top:16px}
.age .num{font-family:'Zen Maru Gothic',sans-serif;font-size:48px;color:var(--pri-d);line-height:1}
.age .num small{font-size:20px}
.age .cap{font-size:13px;color:var(--sub)}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.notice.warn{background:var(--acc-l);color:var(--acc-d)}
.notice.info{background:var(--pri-l);color:var(--pri-d)}
/* course */
.course{border-radius:var(--r);padding:18px;background:linear-gradient(135deg,#F0F6FD,#FFFFFF);border:1.5px solid #CFE0F4}
.course .name{font-family:'Zen Maru Gothic',sans-serif;font-size:22px}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;white-space:nowrap;vertical-align:middle}
.tag.co{background:var(--ok-l);color:var(--ok)}
.tag.self{background:var(--acc-l);color:var(--acc-d)}
.tag.gray{background:#EEF0F2;color:var(--sub)}
.tag.blue{background:var(--pri-l);color:var(--pri)}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding:0;list-style:none}
.items li{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px}
/* options */
.opt{display:flex;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;background:#fff;cursor:pointer}
.opt input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--pri);flex:none}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.opt .nm{font-weight:700}
.opt .meta{font-size:12px;color:var(--sub);margin-top:2px}
.opt .ds{font-size:13px;color:var(--sub);margin-top:4px}
.opt.off{cursor:default;background:#FAFAF8;opacity:.75}
.opt .why{font-size:13px;color:var(--ng);font-weight:700;margin-top:4px}
details.more{margin-top:12px}
details.more summary{cursor:pointer;color:var(--sub);font-size:14px;padding:8px 0}
/* confirm */
dl.sum{margin:0;display:grid;grid-template-columns:7.5em 1fr;gap:8px 12px}
dl.sum dt{color:var(--sub);font-size:14px}
dl.sum dd{margin:0;font-weight:500}
.sum-h{font-weight:700;margin:18px 0 6px;padding-top:14px;border-top:1px dashed var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--acc-l);border-radius:12px;padding:14px 16px;margin-top:16px}
.total b{font-size:26px;color:var(--acc-d);font-family:'Zen Maru Gothic',sans-serif}
/* bottom bar */
.bar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:16px;z-index:5}
.bar .wrap{display:flex;align-items:center;gap:10px}
.bar .stat{flex:1;font-size:12px;color:var(--sub);line-height:1.4}
.bar .stat b{font-size:16px;color:var(--text)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;min-height:48px}
.btn.pri{background:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.ghost{background:transparent;color:var(--sub)}
.btn.line{background:#fff;border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.done{text-align:center;padding:32px 20px}
.done .ic{width:72px;height:72px;border-radius:50%;background:var(--ok-l);color:var(--ok);display:inline-flex;align-items:center;justify-content:center;font-size:40px}
.foot{text-align:center;font-size:12px;color:var(--mute);padding:24px 0 40px}
.foot a{color:var(--mute)}
.demo{background:#FFF4D6;color:#7A5A00;font-size:12px;text-align:center;padding:6px}
/* admin */
.atop{background:#1F2A37;color:#fff;padding:14px 0}
.atop .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.atop h1{font-size:18px;margin:0;flex:1}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;border:0;color:#C9D1DB;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700}
.tabs button.on{background:#fff;color:#1F2A37}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.kpi{background:#fff;border-radius:14px;padding:12px 16px}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:24px;font-weight:700}
.kpi .v small{font-size:13px;color:var(--mute);font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:12px;margin-bottom:12px}
.filters select,.filters input{width:auto;min-height:38px;padding:6px 10px;font-size:14px;border-radius:10px}
.filters .sp{flex:1}
.tbl-wrap{overflow:auto;background:#fff;border-radius:14px;max-height:70vh}
table.t{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
table.t th{position:sticky;top:0;background:#F1F0EA;text-align:left;padding:10px;font-size:12px;color:var(--sub);z-index:1}
table.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
table.t tr.unans td{color:var(--mute)}
table.t select,table.t input[type=date]{min-height:32px;padding:4px 6px;font-size:13px;border-radius:8px;width:auto}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:12px;font-weight:700}
.st.y{background:var(--ok-l);color:var(--ok)}.st.n{background:var(--ng-l);color:var(--ng)}.st.g{background:#EEF0F2;color:var(--sub)}
.warnmark{color:var(--acc-d);font-weight:700}
/* settings */
.sec{background:#fff;border-radius:14px;padding:16px 18px;margin:12px 0}
.sec h3{margin:0 0 4px;font-size:16px}
.ed-row{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:#FCFCFA}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px}
.ed-grid .wide2{grid-column:1/-1}
.ed-grid label{font-size:11px;color:var(--sub);display:block}
.ed-grid input,.ed-grid select,.ed-grid textarea{min-height:36px;padding:6px 8px;font-size:13px;border-radius:8px}
.ed-grid textarea{min-height:60px}
.ed-ctl{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.savebar{position:sticky;bottom:0;background:#1F2A37;color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin:16px 0}
.savebar .msg{flex:1;font-size:13px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1F2A37;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:50}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)} dl.sum{grid-template-columns:6.5em 1fr}}
</style>
</head>

<script>
/* =====================================================================
   接続設定：Apps Script のウェブアプリURL（空欄なら、このブラウザ内に保存するお試しモード）
   ===================================================================== */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwsyoHVNc6uRzPi-v2bhnYEYWsmswr77R66hydZ30rxBEZeoY7sa_6ehAjEiu6l61t4iQ/exec';

/* ---------- 小道具 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const yen = n => n == null ? '未定' : Number(n).toLocaleString('ja-JP') + '円';
const WD = '日月火水木金土';
const fmtD = s => { if (!s) return ''; const [y,m,d] = s.split('-').map(Number); return `${m}月${d}日(${WD[new Date(y,m-1,d).getDay()]})`; };
const fmtMD = s => { if (!s) return ''; const [y,m,d] = s.split('-').map(Number); return `${m}月${d}日`; };
const fmtYMD = s => { if (!s) return ''; const [y,m,d] = s.split('-').map(Number); return `${y}年${m}月${d}日`; };
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), 2200); };
const isNum = v => v !== '' && v != null && !isNaN(+v);

/* ---------- 保存（お試し：ブラウザ内 ／ 本番：Apps Script） ---------- */
const mem = {};
const ls = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
  set(k, v){ mem[k] = clone(v); try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} }
};
const DEFAULT_CONFIG = JSON.parse($('#default-config').textContent);
const SAMPLE = {
  roster: [
    {email:'sato@c-platform.or.jp',    name:'佐藤 花子', birth:'1987-02-10', location:'松江'},
    {email:'suzuki@c-platform.or.jp',  name:'鈴木 一郎', birth:'1983-06-02', location:'松江'},
    {email:'takahashi@c-platform.or.jp',name:'高橋 美咲', birth:'1996-12-20', location:'松江'},
    {email:'ito@c-platform.or.jp',     name:'伊藤 健',   birth:'1991-04-15', location:'リモート（自分で予約）'},
    {email:'watanabe@c-platform.or.jp',name:'渡辺 由紀', birth:'1976-09-30', location:'松江'},
    {email:'yamamoto@c-platform.or.jp',name:'山本 翔',   birth:'2001-01-08', location:'松江'},
    {email:'nakamura@c-platform.or.jp',name:'中村 彩',   birth:'1985-11-05', location:'リモート（自分で予約）'},
    {email:'kobayashi@c-platform.or.jp',name:'小林 大輔', birth:'1969-03-12', location:'松江'}
  ],
  responses: [
    {email:'sato@c-platform.or.jp', name:'佐藤 花子', birth:'1987-02-10', fields:{location:'松江',phone:''}, clinic:'', courseChoice:'base', options:['gastric'], confirmedDate:'2026-11-10', booked:true, done:false, submittedAt:'2026-10-05T09:12:00'},
    {email:'suzuki@c-platform.or.jp', name:'鈴木 一郎', birth:'1983-06-02', fields:{location:'松江',phone:''}, clinic:'', courseChoice:'dock', options:['psa'], confirmedDate:'', booked:false, done:false, submittedAt:'2026-10-05T12:40:00'},
    {email:'takahashi@c-platform.or.jp', name:'高橋 美咲', birth:'1996-12-20', fields:{location:'松江',phone:''}, clinic:'', courseChoice:'base', options:['cervical'], confirmedDate:'', booked:false, done:false, submittedAt:'2026-10-06T08:30:00'},
    {email:'ito@c-platform.or.jp', name:'伊藤 健', birth:'1991-04-15', fields:{location:'リモート（自分で予約）',phone:''}, clinic:'さくら健診センター', courseChoice:'base', options:[], confirmedDate:'2026-11-20', booked:true, done:false, submittedAt:'2026-10-06T18:02:00'},
    {email:'watanabe@c-platform.or.jp', name:'渡辺 由紀', birth:'1976-09-30', fields:{location:'松江',phone:''}, clinic:'', courseChoice:'base', options:['breast','bone','lungct'], confirmedDate:'2026-11-09', booked:true, done:true, submittedAt:'2026-10-07T10:00:00'}
  ]
};

const Store = {
  remote: !!BACKEND_URL,
  async api(params, body){
    const url = BACKEND_URL + '?' + new URLSearchParams(params);
    const r = body
      ? await fetch(BACKEND_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...params, ...body})})
      : await fetch(url);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '通信に失敗しました');
    return j;
  },
  async getConfig(){
    if (this.remote) { const j = await this.api({action:'config'}); return j.config ? fill(j.config) : clone(DEFAULT_CONFIG); }
    const c = ls.get('hc_config'); return c ? fill(c) : clone(DEFAULT_CONFIG);
  },
  async saveConfig(cfg, pin){
    if (this.remote) return this.api({action:'saveConfig', pin}, {config: cfg});
    ls.set('hc_config', cfg);
  },
  async getData(pin){
    if (this.remote) { const j = await this.api({action:'data', pin}); return {roster:j.roster||[], responses:j.responses||[]}; }
    if (ls.get('hc_roster') == null) ls.set('hc_roster', SAMPLE.roster);
    if (ls.get('hc_responses') == null) ls.set('hc_responses', SAMPLE.responses);
    return {roster: ls.get('hc_roster'), responses: ls.get('hc_responses')};
  },
  async submit(resp, passcode){
    if (this.remote) return this.api({action:'submit', passcode: passcode || ''}, {response: resp});
    const list = ls.get('hc_responses') ?? clone(SAMPLE.responses);
    const i = list.findIndex(r => r.email === resp.email);
    let updated = false;
    if (i >= 0) { resp = {...list[i], ...resp}; list[i] = resp; updated = true; } else list.push(resp);
    ls.set('hc_responses', list);
    if (ls.get('hc_roster') == null) ls.set('hc_roster', SAMPLE.roster);
    return {updated};
  },
  async update(email, patch, pin){
    if (this.remote) return this.api({action:'update', pin}, {email, patch});
    const list = ls.get('hc_responses') || [];
    const r = list.find(x => x.email === email); if (r) Object.assign(r, patch);
    ls.set('hc_responses', list);
  },
  async saveRoster(roster, pin){
    if (this.remote) return this.api({action:'saveRoster', pin}, {roster});
    ls.set('hc_roster', roster);
  },
  resetLocal(){ ['hc_config','hc_roster','hc_responses'].forEach(ls.del); }
};
// 保存済み設定に、新しく増えた初期項目を補う
function fill(c){ const d = clone(DEFAULT_CONFIG); for (const k in d) if (c[k] === undefined) c[k] = d[k]; return c; }

/* =====================================================================
   判定ロジック（ルールはすべて設定データから読む）
   ===================================================================== */
const Logic = {
  ageOn(birth, date){
    if (!birth || !date) return null;
    const [by,bm,bd] = birth.split('-').map(Number), [y,m,d] = date.split('-').map(Number);
    let a = y - by; if (m < bm || (m === bm && d < bd)) a--; return a;
  },
  nums: s => String(s ?? '').split(/[,、\s]+/).filter(Boolean).map(Number),
  ids:  s => String(s ?? '').split(/[,、\s]+/).filter(Boolean),
  basisDate(resp, cfg){ return cfg.ageBasis === 'fiscalYearEnd' ? cfg.fiscalYearEnd : (resp.confirmedDate || resp.plannedDate || cfg.examPeriodStart || ''); },
  rule(age, cfg){
    return cfg.ageRules.find(r => {
      const list = Logic.nums(r.ages);
      if (list.length) return list.includes(age);
      return age >= (isNum(r.min) ? +r.min : -Infinity) && age <= (isNum(r.max) ? +r.max : Infinity);
    }) || null;
  },
  course: (id, cfg) => cfg.courses.find(c => c.id === id) || null,
  courseCost(c){ if (!c || c.burden !== 'self') return 0; return isNum(c.price) ? Math.max(0, +c.price - (isNum(c.subsidy) ? +c.subsidy : 0)) : null; },
  optCost: o => o.burden !== 'self' ? 0 : (isNum(o.price) ? +o.price : null),
  ageRange(o){
    const mn = isNum(o.minAge), mx = isNum(o.maxAge);
    let s = mn && mx ? `${o.minAge}〜${o.maxAge}歳` : mn ? `${o.minAge}歳以上` : mx ? `${o.maxAge}歳以下` : '年齢制限なし';
    if (o.parity === 'even') s += '・偶数年齢'; if (o.parity === 'odd') s += '・奇数年齢';
    return s;
  },
  optStatus(o, age, courseId, cfg){
    if (isNum(o.minAge) && age < +o.minAge) return {ok:false, reason:`${o.minAge}歳以上が対象です`};
    if (isNum(o.maxAge) && age > +o.maxAge) return {ok:false, reason:`${o.maxAge}歳以下が対象です`};
    if (o.parity === 'even' && age % 2 !== 0) return {ok:false, reason:`偶数年齢の方が対象です（受診時${age}歳）`};
    if (o.parity === 'odd' && age % 2 === 0)  return {ok:false, reason:`奇数年齢の方が対象です（受診時${age}歳）`};
    const cs = Logic.ids(o.courses);
    if (cs.length && !cs.includes(courseId)) return {ok:false, reason:`${cs.map(id => (Logic.course(id,cfg)||{}).name || id).join('・')}を受ける方が対象です`};
    return {ok:true};
  },
  // 回答1件をまるごと判定
  evaluate(resp, cfg){
    const date = Logic.basisDate(resp, cfg);
    const age = Logic.ageOn(resp.birth, date);
    if (age == null) return {age:null};
    const ov = (cfg.overrides || []).find(o => o.field && resp.fields && resp.fields[o.field] === o.value);
    const rule = ov ? {label: ov.label, course: ov.course, dock: false, message: ov.message, items: ov.items, noOptions: !!ov.noOptions} : Logic.rule(age, cfg);
    const base = rule ? Logic.course(rule.course, cfg) : null;
    const dockOk = !!(rule && rule.dock);
    const course = dockOk && resp.courseChoice === 'dock' ? Logic.course(cfg.dockCourseId, cfg) : base;
    const cid = course ? course.id : '';
    const opts = (resp.options || []).map(id => cfg.options.find(o => o.id === id)).filter(Boolean);
    const valid = rule && rule.noOptions ? [] : opts.filter(o => Logic.optStatus(o, age, cid, cfg).ok);
    const dropped = opts.filter(o => !valid.includes(o));
    let total = 0, unknown = false;
    const cc = Logic.courseCost(course); if (cc == null) unknown = true; else total += cc;
    valid.forEach(o => { const c = Logic.optCost(o); if (c == null) unknown = true; else total += c; });
    const loc = (resp.fields || {})[cfg.selfBookingField] || '';
    const questions = (cfg.extraQuestions || []).filter(q => (!q.location || q.location === loc) && (!Logic.ids(q.courses).length || Logic.ids(q.courses).includes(cid)));
    return {age, date, rule, base, dockOk, course, options: valid, dropped, total, unknown, questions};
  },
  render: (tpl, age) => String(tpl || '').replace(/\{age\}/g, age)
};

/* =====================================================================
   職員画面
   ===================================================================== */
let CFG;
const S = { step:1, name:'', email:'', by:'', bm:'', bd:'', fields:{}, clinic:'', answers:{}, remoteStatus:'', plannedDate:'', courseChoice:'base', options:[], passcode:'', submitted:false };
const birthStr = () => S.by && S.bm && S.bd ? `${S.by}-${String(S.bm).padStart(2,'0')}-${String(S.bd).padStart(2,'0')}` : '';
const selfBooking = () => CFG.selfBookingField && S.fields[CFG.selfBookingField] === CFG.selfBookingValue;
const respFromState = () => ({ email:S.email.trim().toLowerCase(), name:S.name.trim(), birth:birthStr(), fields:{...S.fields},
  clinic: selfBooking() ? S.clinic : '', remoteStatus: selfBooking() ? S.remoteStatus : '', plannedDate: selfBooking() && S.remoteStatus === 'booked' ? S.plannedDate : '',
  courseChoice:S.courseChoice, options:[...S.options], kenpoOk: !!S.kenpoOk, answers:{...S.answers} });
// 表示中の質問の回答だけ残す
const visibleAnswers = ev => { const a = {}; (ev.questions || []).forEach(q => { if (S.answers[q.id]) a[q.id] = S.answers[q.id]; }); return a; };
const locNote = () => (CFG.locationNotes || []).find(n => n.location === S.fields[CFG.selfBookingField]);
const locNoteHtml = (cls = 'info') => { const n = locNote(); if (!n) return '';
  const items = String(n.items || '').split('\n').map(t => t.trim()).filter(Boolean);
  return `<div class="notice ${cls}"><b>${esc(n.title)}</b><ul style="margin:6px 0 0;padding-left:1.2em">${items.map(t => `<li>${esc(t)}</li>`).join('')}</ul>${selfBooking() ? kenpoLink() : ''}</div>`; };

function staffView(){
  const STEPS = ['あなたについて','健診内容','確認'];
  const ev = Logic.evaluate(respFromState(), CFG);
  const stepper = S.submitted ? '' : `<div class="steps">${STEPS.map((t,i) => `<div class="s ${i+1===S.step?'on':''} ${i+1<S.step?'done':''}"><b>${i+1<S.step?'✓':i+1}</b>${t}</div>`).join('')}</div>`;
  let body = '';
  if (S.submitted) body = doneView(ev);
  else if (S.step === 1) body = step1();
  else if (S.step === 2) body = step3(ev);
  else body = step4(ev);
  const showStat = !S.submitted && S.step >= 2 && ev.age != null;
  const bar = S.submitted ? '' : `<div class="bar"><div class="wrap">
      ${S.step > 1 ? `<button class="btn ghost" data-act="back">戻る</button>` : ''}
      <div class="stat">${showStat ? `受診時 <b>${ev.age}歳</b>${S.step>=2?`　自己負担 <b>${yen(ev.total)}${ev.unknown?'＋α':''}</b>`:''}` : ''}</div>
      <button class="btn pri" data-act="${S.step===3?'submit':'next'}">${S.step===3?'この内容で申し込む':'次へ'}</button>
    </div></div>`;
  $('#app').innerHTML = `
    <div class="top"><div class="wrap">
      <div class="org">${esc(CFG.orgName)}</div>
      <h1>${esc(CFG.fiscalYearLabel)} 健康診断の申し込み</h1>
      ${CFG.deadline ? `<span class="chip">回答期限 ${fmtD(CFG.deadline)}</span>` : ''} <span class="chip">所要 約2分</span>
    </div></div>
    <div class="wrap">${stepper}<div id="err"></div>${body}</div>
    ${bar}
    <div class="foot">わからないことは経営管理本部へ　·　<a href="#admin">管理者の方</a></div>`;
  bindStaff();
}

function step1(){
  const y0 = new Date().getFullYear();
  const years = Array.from({length: 62}, (_, i) => y0 - 18 - i);
  const days = S.by && S.bm ? new Date(+S.by, +S.bm, 0).getDate() : 31;
  const fieldHtml = CFG.fields.map(f => {
    const v = S.fields[f.id] ?? '';
    const lab = `<label class="f">${esc(f.label)}${f.required?'<span class="req">必須</span>':''}</label>`;
    const help = f.help ? `<div class="help">${esc(f.help)}</div>` : '';
    if (f.type === 'radio' || f.type === 'select') {
      const ops = Logic.ids(f.options);
      if (f.type === 'select') return lab + `<select data-field="${esc(f.id)}"><option value="">選んでください</option>${ops.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>` + help;
      return lab + `<div class="radio-cards">${ops.map(o=>`<label class="rc ${o===v?'sel':''}"><input type="radio" name="fld_${esc(f.id)}" data-field="${esc(f.id)}" value="${esc(o)}" ${o===v?'checked':''}><div><div class="t">${esc(o)}</div>${o===CFG.selfBookingValue?`<div class="d">健診機関はご自身で予約します</div>`:''}</div></label>`).join('')}</div>` + help;
    }
    return lab + `<input type="${f.type==='tel'?'tel':'text'}" data-field="${esc(f.id)}" value="${esc(v)}">` + help;
  }).join('');
  return `<div class="card">
    <h2>あなたについて</h2>
    <p class="lead">生年月日から、受診日時点の年齢を自動で計算します。</p>
    ${Store.remote && String(CFG.requirePasscode) === 'true' ? `<label class="f">合言葉<span class="req">必須</span></label><input type="password" data-s="passcode" value="${esc(S.passcode)}" autocomplete="off">` : ''}
    <label class="f">氏名<span class="req">必須</span></label>
    <input type="text" data-s="name" value="${esc(S.name)}" autocomplete="name" placeholder="例）地域 花子">
    <label class="f">会社のメールアドレス<span class="req">必須</span></label>
    <input type="email" data-s="email" value="${esc(S.email)}" autocomplete="email" inputmode="email" placeholder="xxxx@c-platform.or.jp">
    <div class="help">同じアドレスでもう一度申し込むと、内容が上書きされます。</div>
    <label class="f">生年月日<span class="req">必須</span></label>
    <div class="row">
      <select data-s="by" aria-label="年"><option value="">年</option>${years.map(y=>`<option value="${y}" ${+S.by===y?'selected':''}>${y}年</option>`).join('')}</select>
      <select data-s="bm" aria-label="月"><option value="">月</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${+S.bm===i+1?'selected':''}>${i+1}月</option>`).join('')}</select>
      <select data-s="bd" aria-label="日"><option value="">日</option>${Array.from({length:days},(_,i)=>`<option value="${i+1}" ${+S.bd===i+1?'selected':''}>${i+1}日</option>`).join('')}</select>
    </div>
    ${S.by ? (() => { const y = new Date().getFullYear(); const a = y - +S.by; return `<div class="notice info">今年（${y}年）で <b style="font-size:18px">${a}歳</b> になります</div>`; })() : ''}
    ${fieldHtml}
  </div>`;
}

const kenpoLink = () => CFG.kenpoClinicUrl ? `<div style="margin-top:6px"><a href="${esc(CFG.kenpoClinicUrl)}" target="_blank" rel="noopener" style="font-weight:700">協会けんぽの契約健診機関一覧（都道府県別）を開く ↗</a></div>` : '';
const remoteDock = () => selfBooking() && S.courseChoice === 'dock';

function ageHero(ev){
  if (ev.age == null) return '';
  let cap, diff = '';
  if (CFG.ageBasis === 'fiscalYearEnd') cap = `${fmtYMD(CFG.fiscalYearEnd)}時点の満年齢`;
  else if (selfBooking() && S.remoteStatus === 'booked' && S.plannedDate) cap = `受診予定日（${fmtD(S.plannedDate)}）時点の満年齢`;
  else {
    cap = `受診期間（${fmtMD(CFG.examPeriodStart)}〜${fmtMD(CFG.examPeriodEnd)}）の満年齢`;
    const a2 = CFG.examPeriodEnd ? Logic.ageOn(birthStr(), CFG.examPeriodEnd) : ev.age;
    if (a2 !== ev.age) diff = `<div class="notice warn">受診期間中に誕生日を迎え、<b>${a2}歳</b>になる場合があります。受ける健診は確定した受診日の年齢で決まり、変わる場合はご連絡します。</div>`;
  }
  return `<div class="age" style="margin:12px 0 0"><div class="num">${ev.age}<small>歳</small></div><div><div style="font-weight:700">あなたは${ev.age}歳として受診します</div><div class="cap">${cap}</div></div></div>${diff}`;
}

function step3(ev){
  if (ev.age == null) return '';
  if (!ev.rule || !ev.base) return `<div class="card"><div class="notice warn">${ev.age}歳に当てはまる健診区分が設定されていません。経営管理本部へお問い合わせください。</div></div>`;
  const items = String(ev.rule.items || '').split('\n').map(s => s.trim()).filter(Boolean);
  const dock = Logic.course(CFG.dockCourseId, CFG);

  const all = CFG.options.map(o => ({o, st: ev.rule.noOptions ? {ok:false, reason:`${ev.base.name}の方は対象外です`} : Logic.optStatus(o, ev.age, cid, CFG)}));
  const ok = all.filter(x => x.st.ok), ng = all.filter(x => !x.st.ok);
  const optCard = ({o, st}) => {
    const c = Logic.optCost(o), on = S.options.includes(o.id);
    const costTag = o.burden === 'self' ? `<span class="tag self">自己負担 ${yen(c)}</span>` : `<span class="tag co">会社負担</span>`;
    const meta = `対象：${Logic.ageRange(o)}${o.target?`・${esc(o.target)}`:''}${o.needsGyn?'・婦人科のある日に受診':''}`;
    if (!st.ok) return `<div class="opt off"><div style="flex:1"><div class="top2"><span class="nm">${esc(o.name)}</span>${costTag}</div><div class="why">${esc(st.reason)}</div><div class="meta">${meta}</div></div></div>`;
    return `<label class="opt ${on?'sel':''}"><input type="checkbox" data-opt="${esc(o.id)}" ${on?'checked':''}><div style="flex:1"><div class="top2"><span class="nm">${esc(o.name)}</span>${costTag}</div><div class="meta">${meta}</div><div class="ds">${esc(o.desc)}</div></div></label>`;

  const companyOk = ok.filter(x => x.o.burden !== 'self'), selfOk = ok.filter(x => x.o.burden === 'self');

    <div class="radio-cards">
      <label class="rc ${S.remoteStatus==='notyet'?'sel':''}"><input type="radio" name="rs" value="notyet" ${S.remoteStatus==='notyet'?'checked':''}><div><div class="t">まだ予約していない</div><div class="d">予約が取れたら、同じメールアドレスでもう一度回答してください</div></div></label>
      <label class="rc ${S.remoteStatus==='booked'?'sel':''}"><input type="radio" name="rs" value="booked" ${S.remoteStatus==='booked'?'checked':''}><div><div class="t">予約済み</div><div class="d">受診予定日と健診機関名を入力してください</div></div></label>

  return `${ageHero(ev)}${locNoteHtml()}<div class="card">${baseCard}${choice}</div>${remoteBox}

    ${companyOk.length ? `<div class="lead" style="font-weight:700;margin:8px 0 0">会社負担で受けられる検診</div>${companyOk.map(optCard).join('')}` : ''}

    ${gynWarn}
    ${ng.length ? `<details class="more"><summary>今回は対象外の検査（${ng.length}件）</summary>${ng.map(optCard).join('')}</details>` : ''}
  </div>`;
}

function validate(step){
  const e = [];
  if (step === 1) {
    if (Store.remote && String(CFG.requirePasscode) === 'true' && !S.passcode.trim()) e.push('合言葉を入力してください');
    if (!S.name.trim()) e.push('氏名を入力してください');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email.trim())) e.push('メールアドレスを正しく入力してください');
    if (!birthStr()) e.push('生年月日を選んでください');
    CFG.fields.forEach(f => { if (f.required && !String(S.fields[f.id] || '').trim()) e.push(`${f.label}を入力してください`); });
  }
  if (step === 2) {
    const ev = Logic.evaluate(respFromState(), CFG);
    if (!ev.rule) e.push('健診区分が見つかりません。経営管理本部へお問い合わせください');
    (ev.questions || []).forEach(q => { if (q.required && !S.answers[q.id]) e.push(`${q.label}を選んでください`); });
    if (selfBooking()) {
      if (!S.remoteStatus) e.push('予約状況を選んでください');
      if (S.remoteStatus === 'booked' && !S.plannedDate) e.push('受診予定日を入力してください');
      if (S.remoteStatus === 'booked' && !S.clinic.trim()) e.push('健診機関名を入力してください');
    }
    if (ev.course && ev.course.id === CFG.dockCourseId && selfBooking() && !S.kenpoOk)
      e.push('人間ドックは協会けんぽの契約健診機関で受ける必要があります。確認のチェックを入れてください');
  }
  return e;
}

function bindStaff(){
  const app = $('#app');
  $$('[data-s]', app).forEach(el => el.addEventListener(el.tagName === 'SELECT' || el.type === 'date' ? 'change' : 'input', () => {
    S[el.dataset.s] = el.value;
    if (el.dataset.s === 'plannedDate') { staffView(); return; }
    if (['by','bm'].includes(el.dataset.s)) { const max = S.by && S.bm ? new Date(+S.by, +S.bm, 0).getDate() : 31; if (+S.bd > max) S.bd = ''; staffView(); }
  }));
  $$('[data-field]', app).forEach(el => el.addEventListener(el.type === 'radio' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
    S.fields[el.dataset.field] = el.value;
    if (el.type === 'radio') staffView();
  }));
  $$('[data-s-check]', app).forEach(el => el.addEventListener('change', () => { S[el.dataset.sCheck] = el.checked; }));
  $$('[data-q]', app).forEach(el => el.addEventListener('change', () => { S.answers[el.dataset.q] = el.value; staffView(); }));
  $$('input[name=rs]', app).forEach(el => el.addEventListener('change', () => { S.remoteStatus = el.value; staffView(); }));
  $$('input[name=cc]', app).forEach(el => el.addEventListener('change', () => { S.courseChoice = el.value; pruneOptions(); staffView(); }));
  $$('[data-opt]', app).forEach(el => el.addEventListener('change', () => {
    const id = el.dataset.opt; S.options = el.checked ? [...S.options, id] : S.options.filter(x => x !== id); staffView();
  }));
  $$('[data-act]', app).forEach(el => el.addEventListener('click', () => act(el.dataset.act)));
}
function pruneOptions(){ const ev = Logic.evaluate(respFromState(), CFG); if (ev.age != null) S.options = ev.options.map(o => o.id); }

async function act(a){
  const showErr = list => { $('#err').innerHTML = list.length ? `<div class="notice warn" style="margin-top:12px">${list.map(esc).join('<br>')}</div>` : ''; if (list.length) window.scrollTo({top:0, behavior:'smooth'}); };
  if (a === 'back') { S.step--; staffView(); return window.scrollTo(0,0); }
  if (a === 'goto2') { S.step = 2; staffView(); return window.scrollTo(0,0); }
  if (a === 'edit') { S.submitted = false; S.step = 1; staffView(); return; }
  if (a === 'next') {
    const e = validate(S.step); if (e.length) return showErr(e);
    if (S.step === 1) pruneOptions();
    S.step++; staffView(); return window.scrollTo(0,0);
  }
  if (a === 'submit') {
    const e = [...validate(1), ...validate(2)]; if (e.length) return showErr(e);
    const btn = $('[data-act=submit]'); btn.disabled = true; btn.textContent = '送信中…';
    const ev = Logic.evaluate(respFromState(), CFG);
    const resp = {...respFromState(), answers: visibleAnswers(ev), submittedAt: new Date().toISOString(),
      snapshot: {age: ev.age, date: ev.date, courseName: ev.course.name, total: ev.total, unknown: ev.unknown}};
    try { const r = await Store.submit(resp, S.passcode); S.updated = !!(r && r.updated); S.submitted = true; staffView(); window.scrollTo(0,0); }
    catch (err) { showErr([err.message]); btn.disabled = false; btn.textContent = 'この内容で申し込む'; }
  }
}

// 名簿と回答を合わせた行を作る
function rows(){
  const {roster, responses} = A.data;
  const map = new Map();
  roster.forEach(p => map.set(p.email.toLowerCase(), {person: p, resp: null}));
  responses.forEach(r => { const k = r.email.toLowerCase(); const x = map.get(k) || {person: null}; x.resp = r; map.set(k, x); });
  return [...map.values()].map(x => {
    const r = x.resp, p = x.person || {};
    const base = r || {email: p.email, name: p.name, birth: p.birth, options: [], fields: {location: p.location}};
    const ev = r ? Logic.evaluate(r, CFG) : (p.birth ? Logic.evaluate({birth: p.birth}, CFG) : {age: null});
    return {
      email: base.email, name: base.name || p.name, birth: base.birth || p.birth, loc: (r && r.fields && r.fields[CFG.selfBookingField]) || p.location || '',
      answered: !!r, inRoster: !!x.person, r, ev,
      clinic: r ? r.clinic || '' : '', gyn: !!(r && ev.options && ev.options.some(o => o.needsGyn)), confirmed: r ? r.confirmedDate || r.plannedDate || '' : '', booked: !!(r && (r.booked || r.remoteStatus === 'booked')), answers: (r && r.answers) || {}, remoteStatus: r ? r.remoteStatus || '' : '', done: !!(r && r.done),
      changed: r && r.snapshot && ev.course && (r.snapshot.courseName !== ev.course.name || r.snapshot.age !== ev.age)
    };
  });
}

function filtered(){
  const f = A.f;
  return rows().filter(x => {
    if (f.ans === 'no' && x.answered) return false; if (f.ans === 'yes' && !x.answered) return false;
    if (f.book === 'no' && (x.booked || !x.answered)) return false; if (f.book === 'yes' && !x.booked) return false;
    if (f.done === 'no' && x.done) return false; if (f.done === 'yes' && !x.done) return false;
    if (f.age === '40' && !(x.ev.age >= 40)) return false;
    if (f.age === '35' && !(x.ev.age >= 35 && x.ev.age <= 39)) return false;
    if (f.age === '34' && !(x.ev.age != null && x.ev.age <= 34)) return false;
    if (f.opt === '_dock' && !(x.ev.course && x.ev.course.id === CFG.dockCourseId)) return false;
    if (f.opt && f.opt !== '_dock' && !(x.ev.options || []).some(o => o.id === f.opt)) return false;
    if (f.loc && x.loc !== f.loc) return false;
    if (f.q && !(`${x.name}${x.email}`.includes(f.q))) return false;
    return true;
  });
}

        <td><b>${esc(x.name)}</b><br><span style="font-size:11px;color:var(--mute)">${esc(x.email)}</span>${x.inRoster?'':'<br><span class="st g">名簿外</span>'}</td>
        <td>${esc((x.birth||'').replace(/-/g,'/'))}</td>
        <td>${x.ev.age ?? '—'}${x.ev.age!=null?'歳':''}${x.changed?' <span class="warnmark" title="申込時から年齢・区分が変わりました">⚠</span>':''}</td>
        <td>${esc(x.loc)}${x.clinic?`<br><span style="font-size:11px;color:var(--mute)">${esc(x.clinic)}</span>`:''}${x.gyn?'<br><span class="st g">婦人科日</span>':''}</td>
        <td>${dateSel(x)}${x.remoteStatus==='notyet'?'<br><span class="st n">各自予約：未予約</span>':''}</td>
        ${(CFG.extraQuestions||[]).map(q => `<td>${esc(x.answers[q.id] || '—')}</td>`).join('')}
        <td>${x.answered && x.ev.course ? esc(x.ev.course.name) : '—'}</td>
        <td style="white-space:normal;min-width:140px">${x.answered ? esc((x.ev.options||[]).map(o=>o.name).join('、')||'なし') : '—'}</td>
        <td>${x.answered ? yen(x.ev.total) + (x.ev.unknown?'＋α':'') : '—'}</td>
        <td>${x.answered ? '<span class="st y">回答済</span>' : '<span class="st n">未回答</span>'}</td>
        <td>${x.answered ? `<label><input type="checkbox" data-book="${esc(x.email)}" ${x.booked?'checked':''}> ${x.booked?'予約済':'未予約'}</label>` : '—'}</td>
        <td>${x.answered ? `<label><input type="checkbox" data-done="${esc(x.email)}" ${x.done?'checked':''}> ${x.done?'受診済':'未受診'}</label>` : '—'}</td>
      </tr>`).join('') || `<tr><td colspan="${11 + (CFG.extraQuestions||[]).length}" style="text-align:center;color:var(--mute);padding:24px">該当する人はいません</td></tr>`}</tbody>
    </table></div>
    <div class="sec">
      <p class="help" style="margin:0">⚠ は、確定日や設定の変更により、申込時と年齢・健診区分が変わった方です。</p>
    </div>`;
  $$('[data-f]').forEach(el => el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'change', () => {
    A.f[el.dataset.f] = el.value;
    if (el.tagName === 'INPUT') { clearTimeout(listTab.t); listTab.t = setTimeout(() => { listTab(); const q = $('[data-f=q]'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); }
    else listTab();
  }));
  const upd = async (email, patch) => {
    const r = A.data.responses.find(x => x.email === email); Object.assign(r, patch);
    try { await Store.update(email, patch, A.pin); toast('保存しました'); } catch (e) { toast(e.message); }
    listTab();
  };
  $$('[data-conf]').forEach(el => el.onchange = () => upd(el.dataset.conf, el.value ? {confirmedDate: el.value, booked: true} : {confirmedDate: '', booked: false}));
  $$('[data-book]').forEach(el => el.onchange = () => upd(el.dataset.book, {booked: el.checked}));
  $$('[data-done]').forEach(el => el.onchange = () => upd(el.dataset.done, {done: el.checked}));
  $('#csv').onclick = () => downloadCsv(list);
}

function downloadCsv(list){
  const head = ['氏名','メール','生年月日','受診時年齢','勤務地','確定した受診日','健診区分','希望オプション','自己負担額','回答','予約','受診','健診機関','電話番号','入社時期', ...(CFG.extraQuestions||[]).map(q => q.label),'回答日時'];
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const lines = [head, ...list.map(x => [x.name, x.email, x.birth, x.ev.age ?? '', x.loc, x.confirmed,
    x.answered && x.ev.course ? x.ev.course.name : '', x.answered ? (x.ev.options||[]).map(o=>o.name).join('、') : '',
    x.answered ? (x.ev.unknown ? `${x.ev.total}+未定` : x.ev.total) : '', x.answered?'回答済':'未回答', x.booked?'予約済':'未予約', x.done?'受診済':'未受診',
    x.r ? x.r.clinic || '' : '', x.r && x.r.fields ? x.r.fields.phone || '' : '', x.r && x.r.fields ? x.r.fields.hire || '' : '', ...(CFG.extraQuestions||[]).map(q => x.answers[q.id] || ''), x.r ? (x.r.submittedAt||'').replace('T',' ').slice(0,16) : ''])];
  const csv = '﻿' + lines.map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = `健診申込一覧_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

function rosterTab(){
  const R = A.data.roster;
  $('#adm').innerHTML = `
    <div class="sec"><h3>名簿（${R.length}名）</h3><p class="lead">名簿にいて回答がない人が「未回答」になります。</p>
      <div class="tbl-wrap" style="max-height:none"><table class="t"><thead><tr><th>氏名</th><th>メール</th><th>生年月日</th><th>勤務地</th><th></th></tr></thead>
      <tbody>${R.map((p,i) => `<tr><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td>${esc(p.birth||'')}</td><td>${esc(p.location||'')}</td><td><button class="btn sm ghost" data-del="${i}">削除</button></td></tr>`).join('')}</tbody></table></div>
    </div>
    <div class="sec"><h3>まとめて追加</h3><p class="lead">Excel等から「氏名,メール,生年月日,勤務地」の順に1行1名で貼り付けてください（生年月日は 1987/2/10 形式も可）。</p>
      <textarea id="paste" rows="6" style="width:100%" placeholder="地域 花子,chiiki-hanako@c-platform.or.jp,1985/4/1,松江"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm pri" id="addR">追加する（同じメールは上書き）</button><button class="btn sm line" id="clearR">名簿を空にする</button></div>
    </div>`;
  const save = async () => { try { await Store.saveRoster(R, A.pin); toast('名簿を保存しました'); } catch (e) { toast(e.message); } rosterTab(); };
  $$('[data-del]').forEach(b => b.onclick = () => { R.splice(+b.dataset.del, 1); save(); });
  $('#clearR').onclick = () => { if (confirm('名簿を空にしますか？')) { R.length = 0; save(); } };
  $('#addR').onclick = () => {
    let n = 0;
    $('#paste').value.split(/\r?\n/).forEach(line => {
      const c = line.split(/\t|,/).map(s => s.trim()); if (!c[1] || !c[1].includes('@')) return;
      const bm = (c[2]||'').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
      const p = {name: c[0], email: c[1].toLowerCase(), birth: bm ? `${bm[1]}-${bm[2].padStart(2,'0')}-${bm[3].padStart(2,'0')}` : '', location: c[3] || ''};
      const i = R.findIndex(x => x.email === p.email); if (i >= 0) R[i] = p; else R.push(p); n++;
    });
    toast(`${n}名を追加しました`); save();
  };
}

function settingsTab(){
  if (!DRAFT) DRAFT = clone(CFG);
  const D = DRAFT;
  const inp = (path, val, type, ops) => {
    if (type === 'check') return `<input type="checkbox" data-p="${path}" ${val?'checked':''} style="width:20px;height:20px;min-height:0">`;
    if (type === 'textarea') return `<textarea data-p="${path}">${esc(val)}</textarea>`;
    if (type === 'select') return `<select data-p="${path}">${ops.map(([v,t]) => `<option value="${v}" ${val===v?'selected':''}>${t}</option>`).join('')}</select>`;
    if (type === 'course') return `<select data-p="${path}">${D.courses.map(c => `<option value="${esc(c.id)}" ${val===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
    return `<input type="${type}" data-p="${path}" value="${esc(val)}">`;
  };
  const editor = key => {
    const E = EDITORS[key];
    return `<div class="sec"><h3>${E.title}</h3><p class="lead">${E.lead}</p>
      ${D[key].map((row, i) => `<div class="ed-row"><div class="ed-grid">
        ${E.cols.map(([k, l, t, ops]) => `<div class="${t==='textarea'?'wide2':''}"><label>${l}</label>${inp(`${key}.${i}.${k}`, row[k], t, ops)}</div>`).join('')}
      </div><div class="ed-ctl"><button class="btn sm ghost" data-mv="${key}.${i}.-1">↑</button><button class="btn sm ghost" data-mv="${key}.${i}.1">↓</button><button class="btn sm ghost" data-rm="${key}.${i}" style="color:var(--ng)">削除</button></div></div>`).join('')}
      <button class="btn sm line" data-add="${key}">＋ 追加</button></div>`;
  };
  const basic = [['fiscalYearLabel','年度名','text'],['orgName','団体名','text'],['deadline','回答期限','date'],
    ['ageBasis','年齢の基準','select',[['examDate','受診日時点の満年齢（確定前は受診期間の開始日）'],['fiscalYearEnd','年度末時点の満年齢']]],
    ['fiscalYearEnd','年度末の日付','date'],['examPeriodStart','受診期間（開始）','date'],['examPeriodEnd','受診期間（終了）','date'],
    ['adminPin','管理者PIN（お試しモード用）','text'],['requirePasscode','職員に合言葉を入力させる','select',[['false','使わない'],['true','使う（Code.gsのSTAFF_PASSCODEと同じもの）']]],['dockCourseId','人間ドックのコースID','text'],
    ['selfBookingField','各自予約を判定する項目ID','text'],['selfBookingValue','各自予約になる選択肢','text']];
  $('#adm').innerHTML = `
    <div class="sec"><h3>基本設定</h3><div class="ed-grid" style="margin-top:8px">
      ${basic.map(([k,l,t,ops]) => `<div><label>${l}</label>${inp(k, String(D[k] ?? ''), t, ops)}</div>`).join('')}
      <div><label>各自予約の予約期限</label>${inp('selfBookingDeadline', D.selfBookingDeadline, 'date')}</div>
      <div class="wide2"><label>各自予約で人間ドックを選んだ方への案内文</label>${inp('selfBookingDockNote', D.selfBookingDockNote, 'textarea')}</div>
      <div class="wide2"><label>協会けんぽ 契約健診機関一覧のURL</label>${inp('kenpoClinicUrl', D.kenpoClinicUrl, 'text')}</div>
    </div></div>
    <div class="sec" style="background:var(--pri-l)"><h3>判定テスト</h3><p class="lead">保存前の設定で、年齢・区分・選べるオプションを確認できます。</p>
      <div class="row" style="flex-wrap:wrap"><div><label class="help">生年月日</label><input type="date" id="tb" value="1987-02-10"></div><div><label class="help">受診日</label><input type="date" id="td" value="2026-10-20"></div></div>
      <div id="tres" style="margin-top:10px"></div></div>
    ${editor('locationNotes')}${editor('overrides')}${editor('ageRules')}${editor('courses')}${editor('options')}${editor('extraQuestions')}${editor('fields')}
    <div class="sec"><h3>バックアップ</h3><p class="lead">設定をファイルに書き出したり、読み込んだりできます。</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm line" id="exp">設定を書き出す（JSON）</button>
      <label class="btn sm line" style="display:inline-flex;align-items:center">設定を読み込む<input type="file" id="imp" accept=".json" class="hidden"></label>
      <button class="btn sm line" id="def">初期設定に戻す</button>
      ${Store.remote ? '' : '<button class="btn sm line" id="wipe" style="color:var(--ng)">お試しデータをすべて消す</button>'}</div></div>
    <div class="savebar"><span class="msg">変更は「保存」するまで職員画面に反映されません。</span><button class="btn sm line" id="cancel" style="color:#1F2A37">変更を破棄</button><button class="btn sm pri" id="save">保存</button></div>`;
  const setPath = (path, v) => { const ks = path.split('.'); let o = D; ks.slice(0,-1).forEach(k => o = o[k]); o[ks[ks.length-1]] = v; };
  $$('[data-p]').forEach(el => el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
    setPath(el.dataset.p, el.type === 'checkbox' ? el.checked : el.value); runTest();
    if (el.tagName === 'SELECT' && /^courses\./.test(el.dataset.p)) settingsTab();
  }));
  $$('[data-add]').forEach(b => b.onclick = () => { D[b.dataset.add].push(EDITORS[b.dataset.add].make()); settingsTab(); });
  $$('[data-rm]').forEach(b => b.onclick = () => { const [k,i] = b.dataset.rm.split('.'); D[k].splice(+i, 1); settingsTab(); });
  $$('[data-mv]').forEach(b => b.onclick = () => { const [k,i,d] = b.dataset.mv.split('.'); const a = D[k], j = +i + +d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; settingsTab(); });
  $('#tb').oninput = $('#td').oninput = runTest; runTest();
  $('#save').onclick = async () => {
    const ids = D.courses.map(c => c.id); const bad = D.ageRules.filter(r => !ids.includes(r.course));
    if (bad.length) return toast('存在しないコースを使っているルールがあります');
    try { await Store.saveConfig(D, A.pin); CFG = clone(D); toast('設定を保存しました'); } catch (e) { toast(e.message); }
  };
  $('#cancel').onclick = () => { DRAFT = clone(CFG); settingsTab(); toast('変更を破棄しました'); };
  $('#def').onclick = () => { if (confirm('初期設定に戻しますか？（保存するまで反映されません）')) { DRAFT = clone(DEFAULT_CONFIG); settingsTab(); } };
  $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 2)], {type:'application/json'})); a.download = 'health-checkup-config.json'; document.body.appendChild(a); a.click(); a.remove(); };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { DRAFT = fill(JSON.parse(t)); settingsTab(); toast('読み込みました（保存で反映）'); } catch (err) { toast('読み込めませんでした'); } }); };
  const w = $('#wipe'); if (w) w.onclick = () => { if (confirm('このブラウザのお試しデータ（設定・名簿・回答）をすべて消し、サンプルに戻しますか？')) { Store.resetLocal(); location.reload(); } };
}

function runTest(){
  const b = $('#tb').value, d = $('#td').value, el = $('#tres');
  if (!b || !d) return el.innerHTML = '';
  const ev = Logic.evaluate({birth: b, confirmedDate: d, courseChoice: 'base', options: []}, DRAFT);
  if (ev.age == null) return el.innerHTML = '';
  if (!ev.rule) return el.innerHTML = `<b>${ev.age}歳</b>：当てはまるルールがありません`;
  const st = DRAFT.options.map(o => ({o, s: Logic.optStatus(o, ev.age, ev.course.id, DRAFT)}));
  el.innerHTML = `<div><b style="font-size:20px">${ev.age}歳</b>（${DRAFT.ageBasis==='fiscalYearEnd'?'年度末基準':'受診日基準'}）→ ルール「${esc(ev.rule.label)}」→ <b>${esc(ev.base.name)}</b>${ev.dockOk?'（人間ドックも選択可）':''}</div>
    <div style="font-size:13px;margin-top:4px">${esc(Logic.render(ev.rule.message, ev.age))}</div>
    <div style="font-size:13px;margin-top:6px">選べる：${st.filter(x=>x.s.ok).map(x=>esc(x.o.name)).join('、')||'なし'}<br><span style="color:var(--sub)">対象外：${st.filter(x=>!x.s.ok).map(x=>`${esc(x.o.name)}（${esc(x.s.reason)}）`).join('、')||'なし'}</span></div>`;
}

/* ---------- 起動 ---------- */
async function route(){ if (location.hash === '#admin') adminView(); else staffView(); }
(async () => {
  if (!Store.remote) { const b = $('#demoBar'); b.textContent = 'お試しモード：入力内容はこのブラウザの中だけに保存されます（サンプルの職員データ入り）'; b.classList.remove('hidden'); }
  try { CFG = await Store.getConfig(); } catch (e) { CFG = clone(DEFAULT_CONFIG); toast('設定を読み込めませんでした'); }
  window.addEventListener('hashchange', () => { DRAFT = null; route(); });
  route();
})();
